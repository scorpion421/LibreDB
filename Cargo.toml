[workspace]
resolver = "2"
members = [
    "crates/libredb-core",
    "crates/libredb-index",
    "crates/libredb-cognitive",
    "crates/libredb-bridge",
    "crates/libredb-cli",
    "crates/libredb-py",
]
default-members = [
    "crates/libredb-core",
    "crates/libredb-index",
    "crates/libredb-cognitive",
    "crates/libredb-bridge",
    "crates/libredb-cli",
]

[workspace.package]
version = "1.5.1"
edition = "2021"
authors = ["Antigravity <antigravity@local.dev>"]
license-file = "LICENSE"
repository = "https://github.com/scorpion421/LibreDB"

[workspace.dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "std"] }
crc32fast = "1.4"
hmac = "0.12"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.14"
