[workspace]
resolver = "2"
members = [
    "crates/libredb-core",
    "crates/libredb-index",
    "crates/libredb-cognitive",
    "crates/libredb-bridge",
    "crates/libredb-cli",
    "crates/libredb-py",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Antigravity <antigravity@local.dev>"]
license = "AGPL-3.0-only"
repository = "http://localhost:3000/MickyFoley/LibreDB"

[workspace.dependencies]
crc32fast = "1.4"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.14"
