[workspace]
resolver = "2"
members = [
    "crates/libredb-core",
    "crates/libredb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity <antigravity@local.dev>"]
license = "AGPL-3.0-only"
repository = "http://localhost:3000/MickyFoley/LibreDB"

[workspace.dependencies]
crc32fast = "1.4"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.14"
