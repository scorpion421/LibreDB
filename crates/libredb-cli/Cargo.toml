[package]
name = "libredb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Command-line interface, MCP cognitive server, lifecycle hooks, and security engine for LibreDB"

[[bin]]
name = "libredb"
path = "src/main.rs"

[features]
default = ["git-automation"]
git-automation = []

[dependencies]
chacha20poly1305.workspace = true
hmac.workspace = true
libredb-cognitive = { path = "../libredb-cognitive" }
libredb-core = { path = "../libredb-core" }
libredb-index = { path = "../libredb-index" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
